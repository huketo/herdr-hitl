version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # "chore(deps)" keeps these out of the release notes: release-please hides
    # the chore section, so dependency churn never reaches the changelog.
    # Do not add `include: scope` here — dependabot would emit
    # "chore(deps)(deps):" and commitlint would reject it.
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
